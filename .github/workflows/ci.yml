name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26
      - run: npm install -g corepack
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Run tests
        id: tests
        env:
          MERGIFY_TEST_JOB_NAME: test (web)
        run: pnpm test
      - name: Mergify CI Upload
        if: (success() || failure()) && hashFiles('junit.xml') != ''
        continue-on-error: true
        env:
          MERGIFY_TEST_JOB_NAME: test (node)
        run: |
          python3 -m pip install --user mergify-cli==2026.11.8
          "$HOME/.local/bin/mergify" ci junit-process junit.xml
      - run: pnpm typecheck
      - run: sh tools/deploy.sh cloudflare.example.env --dry-run
      - run: node tools/check-addresses.mjs
