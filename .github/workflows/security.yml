name: Security scanning

on:
  push:
    branches: [main, 'security/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: "53 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.15"
      - name: Remove stale Semgrep report
        run: rm -f semgrep.sarif
      - name: Run Semgrep
        id: semgrep_scan
        env:
          SEMGREP_SEND_METRICS: "off"
        run: docker run --rm --volume "$GITHUB_WORKSPACE:/src" --workdir /src --user "$(id -u):$(id -g)" --env HOME=/tmp --env SEMGREP_SEND_METRICS=off semgrep/semgrep@sha256:31e9989dbc5e2019ea2f793196480e0b2e43f881984f324d2452254a167684e8 semgrep scan --config p/default --sarif --output semgrep.sarif .
      - name: Validate Semgrep SARIF report
        if: ${{ !cancelled() && steps.semgrep_scan.outcome == 'success' }}
        shell: bash
        run: test -s semgrep.sarif
      - name: Preserve Semgrep SARIF
        id: semgrep_artifact
        if: ${{ !cancelled() && steps.semgrep_scan.outcome == 'success' && hashFiles('semgrep.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize semgrep findings when SARIF upload is unavailable
        if: ${{ !cancelled() && hashFiles('semgrep.sarif') != '' && (steps.semgrep_scan.outcome == 'failure' || steps.semgrep_artifact.outcome == 'failure' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) }}
        env:
          SARIF_FILE: semgrep.sarif
        run: |
          jq -r '
            [.runs[].results[]?] |
            if length == 0 then "No findings reported."
            else .[] |
              (if any(.suppressions[]?; .kind == "inSource") then "Suppressed" else "Finding" end) as $kind |
              ([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
              "\($kind): \(.ruleId // "unknown") at \($where)"
            end
          ' "$SARIF_FILE"
  trivy:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remove stale Trivy report
        run: rm -f trivy.sarif
      - name: Run Trivy
        id: trivy_scan
        env:
          TRIVY_INCLUDE_DEV_DEPS: "true"
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy.sarif
          version: v0.76.2
          scanners: vuln,misconfig,secret,license
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          cache: false
      - name: Validate Trivy SARIF report
        if: ${{ !cancelled() && steps.trivy_scan.outcome == 'success' }}
        shell: bash
        run: test -s trivy.sarif
      - name: Preserve Trivy SARIF
        id: trivy_artifact
        if: ${{ !cancelled() && steps.trivy_scan.outcome == 'success' && hashFiles('trivy.sarif') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sarif-trivy
          path: trivy.sarif
          if-no-files-found: error
          retention-days: 1
      - name: Summarize trivy-filesystem findings when SARIF upload is unavailable
        if: ${{ !cancelled() && hashFiles('trivy.sarif') != '' && (steps.trivy_scan.outcome == 'failure' || steps.trivy_artifact.outcome == 'failure' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == true)) }}
        env:
          SARIF_FILE: trivy.sarif
        run: |
          jq -r '
            [
              .runs[] as $run
              | $run.results[]?
              | . as $result
              | {result: $result, rules: $run.tool.driver.rules}
            ] as $items
            | if ($items | length) == 0 then "No findings reported."
              else
                (
                  $items[] |
                  (.result.message.text // "") as $message |
                  (.result.ruleId // "unknown") as $rule_id |
                  ([$message | split("\n")[] | select(startswith("Severity: ")) | sub("^Severity: "; "") | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")][0]) as $message_severity |
                  ($message_severity // ([.rules[.result.ruleIndex].properties.tags[]? | ascii_upcase | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")][0]) // .result.level // "unknown") as $severity |
                  ([.result.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
                  (if ($message | contains("\nSecret ")) or ($message | contains("\nMatch: ")) then "Secret"
                   elif ($message | contains("\nLicense ")) then "License"
                   elif (($message | contains("\nType: ")) and ($message | contains("\nMessage: "))) then "Misconfiguration"
                   elif ($message | contains("\nVulnerability ")) then "Vulnerability"
                   else "Finding" end) as $kind |
                  if $kind == "Secret" then
                    "Secret [\($severity)] \($rule_id) at \($where): match redacted"
                  elif $kind == "Finding" then
                    "Finding [\($severity)] \($rule_id) at \($where)"
                  else
                    "\($kind) [\($severity)] \($rule_id) at \($where): \($message | @json)"
                  end
                )
              end
          ' "$SARIF_FILE"
  publish-sarif:
    name: Publish SARIF results
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
    needs: [semgrep, trivy]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out scanned revision for SARIF fingerprints
        id: checkout_source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download scanner reports
        if: ${{ !cancelled() }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: sarif-*
          path: ${{ runner.temp }}/sarif-artifacts
          merge-multiple: true
      - name: Validate expected SARIF artifacts
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -eu
          if [ "${{ needs.semgrep.result }}" = "success" ]; then test -s "$RUNNER_TEMP/sarif-artifacts/semgrep.sarif"; fi
          if [ "${{ needs.trivy.result }}" = "success" ]; then test -s "$RUNNER_TEMP/sarif-artifacts/trivy.sarif"; fi
      - name: Upload Semgrep results
        id: upload_semgrep
        if: ${{ !cancelled() && steps.checkout_source.outcome == 'success' && needs.semgrep.result == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif-artifacts/semgrep.sarif
          checkout_path: ${{ github.workspace }}
          category: semgrep
      - name: Summarize Semgrep findings if SARIF publication fails
        if: ${{ !cancelled() && (steps.upload_semgrep.outcome == 'failure' || steps.checkout_source.outcome == 'failure') }}
        env:
          SARIF_FILE: ${{ runner.temp }}/sarif-artifacts/semgrep.sarif
        run: |
          if [ -s "$SARIF_FILE" ]; then
            jq -r '
              [.runs[].results[]?] |
              if length == 0 then "No findings reported."
              else .[] |
                (if any(.suppressions[]?; .kind == "inSource") then "Suppressed" else "Finding" end) as $kind |
                ([.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
                "\($kind): \(.ruleId // "unknown") at \($where)"
              end
            ' "$SARIF_FILE"
          else
            echo "Semgrep SARIF artifact is unavailable."
          fi
      - name: Upload Trivy results
        id: upload_trivy
        if: ${{ !cancelled() && steps.checkout_source.outcome == 'success' && needs.trivy.result == 'success' }}
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: ${{ runner.temp }}/sarif-artifacts/trivy.sarif
          checkout_path: ${{ github.workspace }}
          category: trivy-filesystem
      - name: Summarize Trivy findings if SARIF publication fails
        if: ${{ !cancelled() && (steps.upload_trivy.outcome == 'failure' || steps.checkout_source.outcome == 'failure') }}
        env:
          SARIF_FILE: ${{ runner.temp }}/sarif-artifacts/trivy.sarif
        run: |
          if [ -s "$SARIF_FILE" ]; then
          jq -r '
            [
              .runs[] as $run
              | $run.results[]?
              | . as $result
              | {result: $result, rules: $run.tool.driver.rules}
            ] as $items
            | if ($items | length) == 0 then "No findings reported."
              else
                (
                  $items[] |
                  (.result.message.text // "") as $message |
                  (.result.ruleId // "unknown") as $rule_id |
                  ([$message | split("\n")[] | select(startswith("Severity: ")) | sub("^Severity: "; "") | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")][0]) as $message_severity |
                  ($message_severity // ([.rules[.result.ruleIndex].properties.tags[]? | ascii_upcase | select(. == "CRITICAL" or . == "HIGH" or . == "MEDIUM" or . == "LOW" or . == "UNKNOWN")][0]) // .result.level // "unknown") as $severity |
                  ([.result.locations[]?.physicalLocation? | select(.artifactLocation.uri != null) | "\(.artifactLocation.uri):\(.region.startLine // 1)"] | join(", ") | @json) as $where |
                  (if ($message | contains("\nSecret ")) or ($message | contains("\nMatch: ")) then "Secret"
                   elif ($message | contains("\nLicense ")) then "License"
                   elif (($message | contains("\nType: ")) and ($message | contains("\nMessage: "))) then "Misconfiguration"
                   elif ($message | contains("\nVulnerability ")) then "Vulnerability"
                   else "Finding" end) as $kind |
                  if $kind == "Secret" then
                    "Secret [\($severity)] \($rule_id) at \($where): match redacted"
                  elif $kind == "Finding" then
                    "Finding [\($severity)] \($rule_id) at \($where)"
                  else
                    "\($kind) [\($severity)] \($rule_id) at \($where): \($message | @json)"
                  end
                )
              end
          ' "$SARIF_FILE"
          else
            echo "Trivy SARIF artifact is unavailable."
          fi
